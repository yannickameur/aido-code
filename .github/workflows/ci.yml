name: CI

# Offline tests only: no provider authentication or worker execution.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install released engine dependency
        run: pip install https://github.com/yannickameur/ai-dev-orchestrator/releases/download/v0.2.2/ai_dev_orchestrator-0.2.2-py3-none-any.whl
      - name: Install AIDO Code and test dependencies
        run: pip install -e ".[test]"
      - name: Configure Git identity for disposable test repos
        run: |
          git config --global user.name "AIDO CI"
          git config --global user.email "aido-ci@example.invalid"
      - name: Run offline tests
        run: python -m pytest -q
