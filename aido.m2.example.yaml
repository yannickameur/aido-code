# AIDO Code — governed configuration for AI Dev Orchestrator (schema v1),
# M2 ("Sessions and resume"). See ai-dev-orchestrator/docs/PROJECT_CONFIG.md
# for the full schema reference, and this project's own CONTRIBUTING.md
# for how to use this file locally.
#
# This is the tracked, portable M2 template — analogous to
# aido.example.yaml (M1), never a replacement for it. Copy it to
# `aido.yaml` (already in .gitignore) before running `aido validate`/
# `aido run` against it; never commit a real aido.yaml, since
# state_dir/workspace paths are machine-specific.
#
# Runtime transition note (verified — see ROADMAP.md, M2, "Runtime
# transition"): this file targets the SAME project.id (aido-code) as
# aido.example.yaml (M1), with a new mvp.id (mvp-0.2). AI Dev
# Orchestrator's ProjectRuntime.bootstrap() creates this new MVP under
# the same persisted project/state_dir without disturbing mvp-0.1's
# already-completed WorkItems (WI-01..WI-07) — confirmed by direct code
# inspection and an isolated, fully offline, temporary reproduction
# (never run against the real aido-code state_dir).
#
# No `aido run` has been executed against this file by the task that
# prepared it; see ROADMAP.md, "Status" / M2.

schema_version: 1

project:
  id: aido-code
  name: AIDO Code
  workspace: .
  # state_dir omitted on purpose: defaults deterministically to
  # ~/.local/state/ai-dev-orchestrator/projects/aido-code/ — the SAME
  # state_dir mvp-0.1 already uses, by design (see the transition note
  # above); mvp-0.1's own persisted WorkItems are untouched by this.

workers:
  # Reference (never a copy) to the sibling ai-dev-orchestrator checkout's
  # own real worker pool — identical to aido.example.yaml (M1).
  registry: ../ai-dev-orchestrator/config/workers.yaml

execution:
  # unrestricted: consistent with the maintainer's current environment,
  # identical to M1's own aido.example.yaml. Prints a visible warning on
  # every `aido run`; see ai-dev-orchestrator's docs/PROJECT_CONFIG.md
  # security warning before ever changing this for a shared/untrusted
  # environment.
  permission_mode: unrestricted

git:
  base_branch: main

mvp:
  id: mvp-0.2
  objective: "Add a versioned, persistent session model to AIDO Code (aido-code resume/--resume/-r/--continue/-c, REPL /resume, /new), entirely separate from engine state; see M2_SPEC.yaml for the full acceptance contract."
  acceptance_criteria:
    - "See M2_SPEC.yaml for the complete, authoritative list. This field intentionally stays short; the governed WorkItems below carry the real per-WorkItem criteria."

work_items:
  - id: WI-M2-01
    title: "Session model + versioned persistence"
    required_capabilities: [development]
    dependencies: []
    acceptance_criteria:
      - "A Session dataclass/model exists with, at minimum: schema_version, session_id, created_at, updated_at, a project/config binding placeholder, and an interaction-history placeholder — per docs/SESSION_CONTRACT.md."
      - "session_id is generated stable/opaque/unique/serializable (e.g. uuid4), never derived from project_id/mvp_id/work_item_id/provider/worker."
      - "A session is persisted as one versioned JSON file per session under $XDG_STATE_HOME/aido-code/sessions/ (falling back to ~/.local/state/aido-code/sessions/ when XDG_STATE_HOME is unset) — never inside ai-dev-orchestrator's own state_dir/SQLite."
      - "Every write to a session file is atomic: serialize to a temp file in the same directory, flush + os.fsync, then os.replace onto the target — stdlib only (tempfile/os/os.path), no new dependency. See docs/SESSION_CONTRACT.md, 'Atomic writes'."
      - "A session file that fails to parse or fails schema validation produces a clean, explicit error naming the session id and the problem — never a silent drop/repair, never a raw traceback."
      - "No session field, at any level (including interaction history), ever contains a process environment variable/os.environ dump, an API key/token/credential, raw provider stderr/stdout, or a raw subprocess log. See docs/SESSION_CONTRACT.md, 'Interaction history'."
      - "Offline tests only: no real filesystem location outside a test's own tmp directory is touched by this WorkItem's own tests."

  - id: WI-M2-02
    title: "Session index + deterministic most-recent selection"
    required_capabilities: [development]
    dependencies: [WI-M2-01]
    acceptance_criteria:
      - "A session index (e.g. sessions/index.json) records, per known session, at minimum its session_id and updated_at, kept in sync whenever a session is created/updated."
      - "A most-recent-session lookup (needed by --continue/-c, WI-M2-06) returns the session with the latest updated_at, ties broken deterministically by session_id — never by filesystem iteration/mtime order."
      - "The index never duplicates full session content (interaction history, project binding) — it is a lightweight lookup structure only."
      - "The index is a derived, rebuildable cache, never a second source of truth: a missing/corrupted/stale index.json is silently rebuilt by scanning sessions/*.json directly, and an index inconsistency never fails a resume the session file alone can satisfy. See docs/SESSION_CONTRACT.md, 'The index is a derived cache'."
      - "Index writes are atomic (same temp-file + os.replace mechanism as WI-M2-01's session writes) — one shared helper, never a second, duplicated atomic-write implementation."
      - "Offline tests cover: empty index, single session, multiple sessions with distinct updated_at, a tie-breaking case, and rebuild from session files after the index is deleted/corrupted."

  - id: WI-M2-03
    title: "Session-to-project/config binding"
    required_capabilities: [development]
    dependencies: [WI-M2-01]
    acceptance_criteria:
      - "A session stores a stable reference to its bound project directory and the exact aido.yaml path used — never a duplicated copy of ProjectConfig's own contents, never any engine state."
      - "On resume, this binding is restored as-is, and OrchestratorEngine.open(...) is used to read the current configuration fresh — never a cached/stale copy from the session file."
      - "If the bound project directory or aido.yaml no longer exists at resume time, this fails cleanly with an explicit error naming the missing path — no silent recreation of the project, no raw traceback. See docs/SESSION_CONTRACT.md."
      - "Offline tests cover: a valid binding restored correctly, and a binding whose aido.yaml has been removed/moved."

  - id: WI-M2-04
    title: "Direct resume by session id"
    required_capabilities: [development]
    dependencies: [WI-M2-01, WI-M2-03]
    acceptance_criteria:
      - "aido-code resume <session-id> loads that exact session (interaction history + project binding) and makes it the active session for the current process."
      - "The supplied <session-id> is validated against AIDO Code's own opaque session-id format (e.g. UUID4 shape) before any filesystem path is constructed — a malformed id is rejected with a clean 'invalid session id' error, never passed through to a path lookup. See docs/SESSION_CONTRACT.md, 'Path safety'."
      - "The resolved session file path is confined to sessions/ under this project's own state directory; a symlink found at that path is never followed for read or write — a clean, explicit error instead."
      - "Resuming an unknown/nonexistent session id produces a clean, explicit 'unknown session' error — never a silently created empty session standing in for it."
      - "This resume path never calls OrchestratorEngine.run()/.probe_workers(), never selects a worker, and never mutates engine state — proven by an offline test using a fake subprocess runner scripted to raise if called (mirrors ai-dev-orchestrator's own test conventions)."
      - "A successful resume updates the session's own updated_at (per docs/SESSION_CONTRACT.md, 'When updated_at changes') even if the user issues no further command before exiting."
      - "Offline tests cover: successful resume restoring prior interaction history, unknown-session-id failure, malformed-session-id rejection (before any disk access), and a symlinked session file being refused."

  - id: WI-M2-05
    title: "Interactive resume picker"
    required_capabilities: [development]
    dependencies: [WI-M2-02, WI-M2-04]
    acceptance_criteria:
      - "aido-code resume with no id lists known sessions from the session index (WI-M2-02) for interactive selection."
      - "Selecting a session from the picker resumes it via the exact same mechanism as WI-M2-04's direct resume — never a second, parallel resume implementation."
      - "An empty session index produces a clean, explicit message ('no sessions yet') rather than an empty/confusing picker or a traceback."
      - "Offline tests cover: picker over multiple sessions, and the empty-index case."

  - id: WI-M2-06
    title: "--resume/-r and --continue/-c CLI aliases"
    required_capabilities: [development]
    dependencies: [WI-M2-04, WI-M2-02]
    acceptance_criteria:
      - "aido-code --resume <session-id> and aido-code -r <session-id> are exact aliases of WI-M2-04's direct resume — same code path, never a duplicated implementation."
      - "aido-code --continue and aido-code -c resume the single most recently used session per WI-M2-02's deterministic rule; fail explicitly (never silently create a session) if no session exists yet."
      - "Offline tests cover: -r/--resume equivalence to direct resume, and -c/--continue equivalence to the most-recent-session lookup, including the no-sessions-yet failure."

  - id: WI-M2-07
    title: "REPL /resume and /new"
    required_capabilities: [development]
    dependencies: [WI-M2-01, WI-M2-03, WI-M2-05]
    acceptance_criteria:
      - "REPL /resume offers the same picker as aido-code resume (WI-M2-05), invoked from inside an already-running session; switches the REPL's active session context on selection."
      - "REPL /new creates a fresh session (new session_id, empty interaction history, bound to the current project/config if detected, else explicitly UNBOUND) without creating any engine-side Project/MVP/WorkItem and without triggering any provider call or OrchestratorEngine.run()."
      - "aido-code with no aido.yaml detected in the working directory, aido-code resume, and aido-code -c/--continue all start successfully into an UNBOUND (or, for resume/-c, whatever the resumed session's own binding already was) session rather than failing — see docs/SESSION_CONTRACT.md, 'Unbound sessions'."
      - "A project-requiring REPL command (/status, /workers, /validate, /run) issued from an UNBOUND session prints a clean, consistent 'no project bound' message — never a crash, never a fabricated project, never a filesystem search for one, never a provider call."
      - "The originating session's own file on disk is left untouched by either /resume or /new (no overwrite, no deletion)."
      - "Offline tests cover both REPL commands, an UNBOUND /new, each project-requiring command's behavior from an UNBOUND session, and that the prior session file is unchanged afterward."

  - id: WI-M2-08
    title: "Session/engine isolation acceptance"
    required_capabilities: [development]
    dependencies: [WI-M2-04, WI-M2-06, WI-M2-07]
    acceptance_criteria:
      - "One offline acceptance test proves, across every resume path (resume <id>, resume picker, --resume/-r, --continue/-c, REPL /resume, REPL /new), that OrchestratorEngine.run() is never called and no provider adapter is ever probed/instantiated — via a fake provider_adapters/subprocess_runner scripted to raise if invoked, exactly mirroring ai-dev-orchestrator's own test_cli.py::TestStatus::test_status_never_instantiates_any_provider_adapter convention."
      - "A companion test proves the SessionStore never persists WorkItem status/MVP status/WAITING/RECOVERY_REQUIRED/ExecutionRecord/quota/QA verdict/merge state as a source of truth — any such fact in a session file is a historical display record only, and a live query is shown to come from a fresh OrchestratorEngine call, never the session's own cache."
      - "This WorkItem's own QA is the acceptance gate for the resume/run separation invariant (ARCHITECTURE.md, 'Hard invariant (M2)')."

  - id: WI-M2-09
    title: "Concurrency/corruption/error handling"
    required_capabilities: [development]
    dependencies: [WI-M2-01]
    acceptance_criteria:
      - "Two processes attempting to open the exact same session concurrently never silently corrupt it: a real OS-level advisory lock (fcntl.flock(LOCK_EX | LOCK_NB) on Linux/macOS, the platforms this project targets — stdlib only, no new dependency) makes the second attempt fail explicitly with an 'already in use' error — no session broker/server is built."
      - "A process holding a session lock that is killed (SIGKILL, crash), not just cleanly exited, never leaves a stale lock behind: the kernel releases a flock() held against that process's own file descriptor automatically on process death, so a subsequent legitimate open is never blocked by a dead process's lock. No separate stale-lock detection/cleanup logic exists or is needed."
      - "A hand-corrupted session file (invalid JSON, or valid JSON failing schema validation) produces the clean, explicit error already required by WI-M2-01 — this WorkItem adds test coverage for realistic corruption shapes (truncated file, wrong schema_version, missing required field)."
      - "A corrupted or missing sessions/index.json is silently rebuilt from the real session files rather than treated as an error (WI-M2-02's own contract) — this WorkItem adds the corruption-shape test coverage for that rebuild."
      - "Offline tests cover: concurrent-open lock contention with two REAL, independent OS processes (e.g. via multiprocessing/subprocess against the same session_id — not only simulated contention within one test process), a killed-holder process releasing its lock (verified by starting a second real process and confirming it can then acquire the lock), and each corruption shape above."

  - id: WI-M2-10
    title: "Resume-after-process-restart acceptance"
    required_capabilities: [development]
    dependencies: [WI-M2-01, WI-M2-04, WI-M2-09]
    acceptance_criteria:
      - "One offline, end-to-end acceptance test creates a session, writes interaction history, simulates a full process restart (a fresh in-process Session/SessionStore instance reading only from disk, no in-memory state carried over), then resumes that same session id and confirms its interaction history and project binding are intact."
      - "The full M2_SPEC.yaml acceptance_criteria list is satisfied; this WorkItem's own QA is the final gate for M2."
      - "pytest -q passes for the whole package, offline, with zero real provider/Ralph calls anywhere in the suite, and zero regression in M1's own existing tests (MVP_SPEC.yaml)."

qa:
  - id: qa-tests
    kind: unit_test
    argv: ["pytest", "-q"]
    timeout_seconds: 300
    required: true

qa_protected_paths:
  - tests/test_e2e.py
  - tests/test_terminal_sanitizer.py
