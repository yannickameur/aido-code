# AIDO Code — portable template of this repository's own governed
# configuration (schema v1, roadmap-driven). Copy it to `aido.yaml`
# (ignored by Git) before `aido validate`/`aido run`. The approved
# milestone and its WorkItems come from ROADMAP.md's `## Current
# milestone` block (docs/PROJECT_CONTRACT.md). State defaults to
# ~/.local/state/ai-dev-orchestrator/projects/aido-code/.

schema_version: 1

project:
  id: aido-code
  name: AIDO Code
  workspace: "."

roadmap: "./ROADMAP.md"

resources: "./resources"

initial_prompt: >
  Read ROADMAP.md and the project resources referenced by it before doing
  any work. Execute only the currently approved milestone. Respect its
  scope, dependencies, acceptance criteria and explicit out-of-scope
  decisions. Apply REUSE FIRST, KISS and YAGNI.
