# M2 acceptance contract: AIDO Code, milestone M2 (sessions and resume).
# See ROADMAP.md for the full milestone list, docs/SESSION_CONTRACT.md
# for the full session data model/persistence/concurrency contract, and
# docs/ENGINE_CONTRACT.md for the exact engine API this MVP consumes.
#
# This file states what "done" means for M2. It does not itself execute
# anything; the governed WorkItems that implement it live in
# aido.m2.example.yaml's work_items section, driven by AI Dev
# Orchestrator (see CONTRIBUTING.md), never by a human/assistant writing
# code directly into this repository.

schema_version: 1

mvp:
  id: mvp-0.2
  name: Sessions and resume
  objective: >
    Add a versioned, persistent session model to AIDO Code, entirely
    separate from orchestrator engine state: aido-code resume/--resume/
    -r/--continue/-c and REPL /resume, /new, on top of the real
    OrchestratorEngine facade M1 already established, never a second,
    duplicated orchestration implementation, and never an automatic
    trigger of OrchestratorEngine.run().

acceptance_criteria:
  - "A session is persisted in a versioned format (schema_version field) under this project's own state directory ($XDG_STATE_HOME/aido-code/ or ~/.local/state/aido-code/), never inside ai-dev-orchestrator's own state_dir and never in its SQLite files. See docs/SESSION_CONTRACT.md."
  - "A new session receives a session_id that is stable, opaque, unique, and serializable, never derived from or coupled to project_id/mvp_id/work_item_id/provider/worker."
  - "aido-code resume <session-id> resumes that exact session directly."
  - "aido-code resume with no id presents an interactive picker over the session index."
  - "aido-code --resume <session-id> and aido-code -r <session-id> are aliases of direct resume."
  - "aido-code --continue and aido-code -c resume the single most recently used session, selected by a documented, deterministic rule (docs/SESSION_CONTRACT.md, 'When updated_at changes' — a successful open/resume counts, not only a command received), never by filesystem iteration order; ties break by session_id."
  - "REPL /resume offers the same picker as aido-code resume, from inside a running session."
  - "A session records a stable reference to the project directory and the exact aido.yaml path it is bound to, restored on resume, without duplicating ProjectConfig or engine state inside the session."
  - "A session persists and correctly restores after this process fully restarts (new process, same session file on disk)."
  - "The session index (sessions/index.json) is a derived, rebuildable cache, never a second source of truth: a missing, corrupted, or stale index is silently rebuilt from the real session files, and an index inconsistency never fails a resume the session file itself can satisfy. See docs/SESSION_CONTRACT.md, 'The index is a derived cache'."
  - "Every session/index file write is atomic (temp file in the same directory, flush + os.fsync, then os.replace) — stdlib only, no new dependency. See docs/SESSION_CONTRACT.md, 'Atomic writes'."
  - "resume <session-id>'s id is validated against AIDO Code's own opaque session-id format before any filesystem access; an id of the wrong shape is rejected with a clean error, never passed through to a path lookup. See docs/SESSION_CONTRACT.md, 'Path safety'."
  - "Every resolved session/index file path is confined to sessions/ under this project's own state directory; a symlink found at a session/index file's path is never followed for read or write. See docs/SESSION_CONTRACT.md, 'Path safety'."
  - "aido-code (no project detected), aido-code resume/-c, and REPL /new/-help all start successfully with no aido.yaml present, producing an UNBOUND session — never a crash, never a fabricated project. A project-requiring command (/status, /workers, /validate, /run) issued from an unbound session replies with a clean 'no project bound' message: never a crash, never a fabricated project, never a filesystem search for one, never a provider call. See docs/SESSION_CONTRACT.md, 'Unbound sessions'."
  - "No resume path (aido-code resume, resume <id>, --resume/-r, --continue/-c, REPL /resume or /new) ever calls OrchestratorEngine.run(), directly or indirectly."
  - "No resume path ever calls OrchestratorEngine.probe_workers() or otherwise causes a provider call, and never selects a worker."
  - "The SessionStore never persists WorkItem status, MVP status, WAITING/RECOVERY_REQUIRED, ExecutionRecord, quota state, QA verdict, or merge state as a source of truth; any current query about project state goes through OrchestratorEngine again. See docs/SESSION_CONTRACT.md, 'Never a duplicate source of truth for engine state'."
  - "A session's interaction history never contains a process environment variable/os.environ dump, an API key/token/credential, raw provider stderr/stdout, or a raw subprocess log — only OrchestratorEngine's own typed snapshot DTOs (or a structured reference to one). See docs/SESSION_CONTRACT.md, 'Interaction history'. This is distinct from, and does not substitute for, terminal rendering safety (M1.3, WI-M1.3-02)."
  - "A corrupted or unparseable session file produces a clean, explicit error naming the session id and the problem, never a silent drop/repair and never a raw traceback."
  - "Resuming an unknown/nonexistent session id produces a clean, explicit error, never a silently created empty session."
  - "Two processes attempting to open the same session concurrently never silently corrupt it: a real OS-level advisory lock (fcntl.flock() on the platforms this project targets) produces an explicit 'already in use' error, fail-closed, per docs/SESSION_CONTRACT.md's concurrency contract; no session broker/server is built. Proven with two real, independent OS processes, not only simulated contention in one test process."
  - "A killed (not cleanly exited) process holding a session lock never leaves a stale lock blocking a later legitimate open — the OS releases a kernel-held advisory lock automatically on process death; no separate stale-lock cleanup step exists or is needed."
  - "All tests are offline: fake provider adapters and a fake/scripted Ralph subprocess runner passed through OrchestratorEngine.open()'s own provider_adapters/subprocess_runner seams, never a real Claude/Codex/Vibe/DeepSeek/Kimi/Ralph invocation; a test asserting a resume/continue/new path never triggers a provider call is part of this MVP's own QA (WI-M2-08)."
  - "M1's existing acceptance criteria (MVP_SPEC.yaml) are not regressed: /status, /workers, /config, /validate, /run, /help, /exit all still behave exactly as M1 specified, with or without an active session."

out_of_scope_for_this_mvp:
  - "Natural-language piloting / LLM-driven conversation history (M3) — M2's interaction history is a plain structured record, never an LLM conversation."
  - "Non-interactive mode, -p (M4)."
  - "json/stream-json structured output (M5)."
  - "aido-code doctor (M6)."
  - "Real-time timeline rendering of engine events (M7)."
  - "Claiming the `aido` command name (M8) — every command in this file's own acceptance criteria uses aido-code/python -m aido_code, never aido."
  - "A session broker/server, or any cross-machine session coordination."
  - "A degraded read-only session mode when the bound project/aido.yaml is missing — the clean-failure path is what M2 requires; a degraded mode is a possible future refinement, not built now (YAGNI)."
