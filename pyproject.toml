[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aido-code"
version = "0.1.0"
description = "AIDO Code: the interactive terminal frontend for AI Dev Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["orchestrator>=0.1.1"]

[project.scripts]
aido-code = "aido_code.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
